name: Isolated Chromium MFA and PostgreSQL journey

# The integration journeys span authentication, cookies, HTTP routes and db/*.sql.
# Do not path-filter: dependency-only changes must exercise real Chrome.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  chrome-mfa-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_DB: facturations_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-not-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d facturations_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      FACTURATIONS_TEST_DATABASE_URL: postgresql://postgres:test-only-not-production@127.0.0.1:5432/facturations_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install from lockfile without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Initialize disposable database
        run: node scripts/setup-test-db.js
      - name: Find real Chrome or Chromium (never silently skip)
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v chromium-browser)" >> "$GITHUB_ENV"
          else
            echo 'Chrome/Chromium missing: integrated smoke cannot be skipped' >&2
            exit 1
          fi
      - name: Real Chrome FR/EN, real MFA, real PostgreSQL (fictional data only)
        run: node scripts/browser-smoke-mfa-postgres.js
      - name: Real Chrome FR/EN, actual MFA and revisioned PostgreSQL autosave (fictional data only)
        run: node scripts/browser-smoke-mfa-postgres-autosave.js
      - name: Real Chrome FR/EN, autosave to immutable submission, internal approval and unissued print
        run: node scripts/browser-smoke-owner-review.js
