name: Isolated Chromium editor smoke

on:
  push:
    paths:
      - 'scripts/browser-smoke.js'
      - 'src/browser-workspace-editor.js'
      - 'src/workspace-editor-client.js'
      - 'src/browser-workspace-preview.js'
      - '.github/workflows/browser-smoke.yml'
  pull_request:
    paths:
      - 'scripts/browser-smoke.js'
      - 'src/browser-workspace-editor.js'
      - 'src/workspace-editor-client.js'
      - 'src/browser-workspace-preview.js'
      - '.github/workflows/browser-smoke.yml'

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate installed Chrome or Chromium (fail rather than skip)
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v chromium-browser)" >> "$GITHUB_ENV"
          else
            echo 'Chrome/Chromium missing: browser smoke cannot be silently skipped' >&2
            exit 1
          fi
      - name: Browser smoke with fictional data and no external services
        run: node scripts/browser-smoke.js
