name: Wave connector and draft tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_DB: facturations_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-not-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d facturations_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FACTURATIONS_TEST_DATABASE_URL: postgres://postgres:test-only-not-production@127.0.0.1:5432/facturations_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/setup-test-db.js
      - run: npm run check
      - run: npm test
      - name: Prove isolated PostgreSQL backup and restore
        run: npm run test:backup-restore
